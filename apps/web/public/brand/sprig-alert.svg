<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" width="100%" height="100%" fill="none" role="img" aria-label="Sprig the CareBuddy assistant - Alert: Sprig has a reminder">
  <!-- Calm Alert Ring (#D99B43) -->
  <circle cx="50" cy="50" r="46" stroke="#D99B43" stroke-width="3" stroke-dasharray="4 2" opacity="0.9" />

  <!-- Left Leaf Half (Primary #397B68) -->
  <path d="M 50 14 C 28 14 18 36 18 54 C 18 72 34 84 50 84 Z" fill="#397B68" />
  <!-- Right Leaf Half (Lighter Secondary #8DB9A6) -->
  <path d="M 50 14 C 72 14 82 36 82 54 C 82 72 66 84 50 84 Z" fill="#8DB9A6" />
  
  <!-- Stem -->
  <path d="M 50 84 C 50 89 48 93 45 95" stroke="#397B68" stroke-width="3" stroke-linecap="round" />

  <!-- Central Vein forming a Heart -->
  <path d="M 50 84 L 50 64 M 50 64 C 42 58 37 49 41 44 C 45 39 50 43 50 48 C 50 43 55 39 59 44 C 63 49 58 58 50 64 Z" 
        stroke="#1E2B28" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" fill="none" opacity="0.35" />

  <!-- Attentive Face -->
  <circle cx="42" cy="34" r="3.2" fill="#1E2B28" />
  <circle cx="58" cy="34" r="3.2" fill="#1E2B28" />
  <path d="M 46 41 Q 50 44 54 41" stroke="#1E2B28" stroke-width="2.4" stroke-linecap="round" fill="none" />

  <!-- Notification Badge at Top Right (Warning #D99B43 with #1E2B28 icon for contrast) -->
  <g transform="translate(76, 20)">
    <circle cx="0" cy="0" r="10" fill="#D99B43" stroke="#FFFFFF" stroke-width="2" />
    <!-- Exclamation mark (#1E2B28 text/stroke) -->
    <line x1="0" y1="-5" x2="0" y2="1" stroke="#1E2B28" stroke-width="2.2" stroke-linecap="round" />
    <circle cx="0" cy="4.5" r="1.2" fill="#1E2B28" />
  </g>
</svg>
