<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" width="100%" height="100%" fill="none" role="img" aria-label="Sprig the CareBuddy assistant - Thinking">
  <!-- Slightly tilted leaf group for curious posture -->
  <g transform="rotate(2 50 50)">
    <!-- Left Leaf Half (Primary #397B68) -->
    <path d="M 50 14 C 28 14 18 36 18 54 C 18 72 34 84 50 84 Z" fill="#397B68" />
    <!-- Right Leaf Half (Lighter Secondary #8DB9A6) -->
    <path d="M 50 14 C 72 14 82 36 82 54 C 82 72 66 84 50 84 Z" fill="#8DB9A6" />
    
    <!-- Stem -->
    <path d="M 50 84 C 50 89 48 93 45 95" stroke="#397B68" stroke-width="3" stroke-linecap="round" />

    <!-- Central Vein forming a Heart -->
    <path d="M 50 84 L 50 64 M 50 64 C 42 58 37 49 41 44 C 45 39 50 43 50 48 C 50 43 55 39 59 44 C 63 49 58 58 50 64 Z" 
          stroke="#1E2B28" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" fill="none" opacity="0.35" />

    <!-- Abstract Face looking slightly up -->
    <circle cx="42" cy="31" r="3.2" fill="#1E2B28" />
    <circle cx="58" cy="31" r="3.2" fill="#1E2B28" />
    <!-- Soft Curious Smile -->
    <path d="M 46 40 Q 50 43 54 40" stroke="#1E2B28" stroke-width="2.4" stroke-linecap="round" fill="none" />
  </g>

  <!-- Three thinking dots beside the leaf -->
  <circle cx="86" cy="34" r="3.5" fill="#A99AE8" />
  <circle cx="92" cy="24" r="3" fill="#A99AE8" opacity="0.8" />
  <circle cx="89" cy="14" r="2.5" fill="#A99AE8" opacity="0.6" />
</svg>
