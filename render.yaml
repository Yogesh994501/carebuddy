services:
  # ==============================================================================
  # CareBuddy Full-Stack Web Service
  # Runs Express API + Serves Vite React Frontend + Embedded Background Worker
  # Fully compatible with Render Free Tier
  # ==============================================================================
  - type: web
    name: carebuddy
    runtime: node
    plan: free
    region: oregon
    buildCommand: npm install --include=dev && npm run build
    startCommand: npm start
    healthCheckPath: /health
    autoDeploy: true
    envVars:
      - key: NODE_ENV
        value: production
      - key: PORT
        value: 10000
      - key: WEB_ORIGIN
        value: "*"
      - key: DEMO_MODE
        value: "true"
      - key: RUN_EMBEDDED_WORKER
        value: "true"
      - key: DATABASE_URL
        sync: false
      - key: SESSION_SECRET
        sync: false
      - key: INVITATION_PEPPER
        sync: false
      - key: CSRF_SECRET
        sync: false
      - key: GEMINI_API_KEY
        sync: false
      - key: GEMINI_MODEL
        value: gemini-1.5-flash

  # ==============================================================================
  # OPTIONAL: Dedicated Background Worker
  # (Render requires a paid Starter plan for separate worker services.
  # If on Free Tier, leave this commented out as the web service runs
  # the embedded worker automatically when RUN_EMBEDDED_WORKER=true).
  # ==============================================================================
